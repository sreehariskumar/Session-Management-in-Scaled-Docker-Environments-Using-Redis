version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend1
      - frontend2

  frontend1:
    build: ./app
    container_name: frontend1
    environment:
      - FLASK_ENV=production
    depends_on:
      - redis
      - db

  frontend2:
    build: ./app
    container_name: frontend2
    environment:
      - FLASK_ENV=production
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    container_name: redis

  db:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: